# fly.toml app configuration file generated for stonpool-api on 2026-07-02T17:22:11+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'stonpool-api'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'
  context = "."

  # the keeper process shares this image; without pytoniq a live keeper
  # (mnemonic set) dies on import
  [build.args]
    INSTALL_KEEPER = 'true'

[deploy]
  release_command = 'alembic upgrade head'

[processes]
  api = 'uvicorn app.api.app:create_app --factory --host 0.0.0.0 --port 8000'
  keeper = 'python -m app.keeper'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['api']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
