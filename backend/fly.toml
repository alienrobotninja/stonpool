app = "stonpool-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[build.args]
  # keeper image carries pytoniq; the api process just never imports it
  INSTALL_KEEPER = "true"

[deploy]
  release_command = "alembic upgrade head"

[processes]
  api = "uvicorn app.api.app:create_app --factory --host 0.0.0.0 --port 8000"
  keeper = "python -m app.keeper"

# only the api group is web-served; keeper is a worker with no ingress
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1  # keeps the indexer polling; do not scale api to zero
  processes = ["api"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"