app = "stonpool-web"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

# vite inlines these at image build; the env guard fails the build if the required ones are unset.
# override per deploy: fly deploy --build-arg VITE_API_BASE_URL=... --build-arg VITE_POOL_CORE_ADDRESS=...
[build.args]
  VITE_APP_URL = "https://stonpool-web.fly.dev"
  VITE_NETWORK = "testnet"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"