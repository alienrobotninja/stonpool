app = 'stonpool-web'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

  # vite inlines these at build time; the env guard fails the build if the
  # required ones are missing, so they live here rather than in CLI flags
  [build.args]
    VITE_APP_URL = 'https://stonpool-web.fly.dev'
    VITE_API_BASE_URL = 'https://stonpool-api.fly.dev'
    VITE_NETWORK = 'testnet'
    VITE_POOL_CORE_ADDRESS = '0:566af724a955a1ea7518fee4905f23de92e6d9178444df5530f9bee48e308399'
    VITE_FAUCET_ADDRESS = '0:fd9304b1b6a48095946e03f453adab8ff200a0ca68dbf2370ec7f6ff1001fe9b'
    VITE_JETTON_MINTER_ADDRESS = '0:35641705ecea9f16147e51e462ccd4a3c44f32bd4cb98e1d11bc3edf4fd10898'
    VITE_ADAPTER_ADDRESS = '0:0fe2a1881293389ae767a571b1eeec3f11ca972ddc6eecf99b371a875e2c83b8'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
